Name: Build Android APK

On:

Push:

Branches: [main, master]

Pull_request:

Branches: [main, master]

Workflow_dispatch:

Jobs:

Build:

Runs-on: ubuntu-latest # Use the latest compatible runtime environment

Steps:

- Name: Checkout Repository

Uses: actions/checkout@v4 # Update the checkout procedure to be compatible with the latest versions of Node.js

- Name: Set up JDK 17

Uses: actions/setup-java@v5 # Upgrade to version 5 as required by the system

With:

Distribution: 'temurin'

Java-version: '17' # Change the version if your project requires a different version (e.g., 11 or 21)

- Name: Grant execute permission for gradlew

Run: chmod +x gradlew

- Name: Build APK with Gradle

Run: ./gradlew assembleRelease # Or assembleDebug depending on the build type  You need it:

- Name: Upload APK Artifact

Uses: actions/upload-artifact@v4

With:

Name: app-release-apk

Path: app/build/outputs/apk/release/*.apk # Make sure the path to the resulting APK file is correct in your project.
