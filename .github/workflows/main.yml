name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # استخدام أحدث بيئة تشغيل متوافقة

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # تحديث إجراء الـ checkout ليتوافق مع الإصدارات الحديثة لـ Node.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5 # الترقية إلى الإصدار الخامس كما يطلب النظام
        with:
          distribution: 'temurin'
          java-version: '17' # قم بتغيير الإصدار إذا كان مشروعك يتطلب إصداراً آخر (مثل 11 أو 21)

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease # أو assembleDebug حسب نوع البناء الذي تحتاجه

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk # تأكد من مسار ملف الـ APK الناتج في مشروعك
